name: Render video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 \
            libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 \
            libpango-1.0-0 libcairo2 libcups2

      - name: Buka zip project
        run: |
          unzip -o ./*.zip
          test -f vo.mp3 && mv vo.mp3 public/vo.mp3 || true
          test -f public/vo.mp3 || (echo "vo.mp3 belum ada" && exit 1)

      - name: Install npm packages
        run: npm install

      - name: Render
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: kuda-troya-video
          path: out/kuda-troya-di-jantung-fbi.mp4
          retention-days: 7
